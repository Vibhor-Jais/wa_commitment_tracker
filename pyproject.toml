[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wa-commitment-tracker"
version = "0.1.0"
description = "Turn a WhatsApp sales team's daily commitment messages into an Excel tracker"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "openpyxl>=3.1",
    "flask>=3.0",
]

[project.scripts]
wa-tracker = "wa_commitment_tracker.cli:main"

[tool.setuptools]
packages = ["wa_commitment_tracker"]

# Explicit entrypoint for Vercel, since the repo's root app.py is the
# Streamlit UI, not a Flask app - this sidesteps Vercel's filename-based
# auto-detection (app.py/index.py/etc. at root or in src/ or app/) entirely
# and points it directly at the real Flask instance.
[tool.vercel]
entrypoint = "api.index:app"
